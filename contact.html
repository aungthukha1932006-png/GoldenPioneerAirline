  <link rel="stylesheet" href="contact.css">
  <script src="app.js" defer></script>
</head>
<body data-page="contact">
  <header class="site-header">
    <a class="brand" href="index.html">✈ SkyWings</a>
    <nav class="nav">
  <a href="index.html">Home</a>
  <a href="destinations.html">Destinations</a>
  <a href="tickets.html">Tickets</a>

  <a href="login.html" id="navLogin">Login</a>
  <a href="#" id="navLogout" hidden>Logout</a>
</nav>
  </header>

  <main class="wrap">
    <h1>Contact Us</h1>
    <p class="sub">We usually respond within 24 hours.</p>

    <form id="contactForm" class="form">
      <label>Name
        <input name="name" placeholder="Your name" required/>
      </label>
      <label>Email
        <input type="email" name="email" placeholder="you@example.com" required/>
      </label>
      <label>Message
        <textarea name="message" rows="5" placeholder="How can we help?" required></textarea>
      </label>
      <button class="btn primary" type="submit">Send Message</button>
      <p id="contactStatus" class="status" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> SkyWings Airline</p>
  </footer>
</body>
</html>
