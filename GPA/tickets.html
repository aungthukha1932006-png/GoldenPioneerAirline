<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkyWings · Tickets</title>
  <link rel="stylesheet" href="tickets.css">
  <script defer src="app.js"></script>
</head>
<body data-page="tickets">
  <header class="site-header">
    <a class="brand" href="index.html">✈ SkyWings</a>
    <nav class="nav">
  <a href="index.html">Home</a>
  <a href="destinations.html">Destinations</a>
  <a href="tickets.html">Tickets</a>
  <a href="food.html">Food</a>
  <a href="seats.html">Seats</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>

  <!-- Add these two: -->
  <a href="login.html" id="navLogin">Login</a>
  <a href="#" id="navLogout" hidden>Logout</a>
</nav>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <h1>Find Your Flight</h1>
      <p>Search fares, compare times, and book in minutes.</p>
    </div>
  </section>

  <main class="wrap">
    <form id="ticketForm" class="form">
      <div class="row">
        <label>From
          <input name="from" list="cities" placeholder="e.g., Yangon" required/>
        </label>
        <label>To
          <input name="to" list="cities" placeholder="e.g., Singapore" required/>
        </label>
        <datalist id="cities">
          <option>Yangon</option><option>Singapore</option><option>Bangkok</option>
          <option>Dubai</option><option>Tokyo</option><option>Seoul</option><option>Kuala Lumpur</option>
        </datalist>
      </div>
      <div class="row">
        <label>Departure
          <input name="depart" type="date" required/>
        </label>
        <label>Passengers
          <select name="pax"><option>1</option><option>2</option><option>3</option><option>4</option></select>
        </label>
        <label>Max price (USD)
          <input name="maxPrice" type="number" min="0" placeholder="e.g., 500"/>
        </label>
      </div>
      <div class="row">
        <label>Sort by
          <select name="sort">
            <option value="price">Price</option>
            <option value="time">Departure Time</option>
          </select>
        </label>
        <label>Time window
          <select name="window">
            <option value="">Any</option>
            <option value="morning">Morning (05:00–11:59)</option>
            <option value="afternoon">Afternoon (12:00–17:59)</option>
            <option value="evening">Evening (18:00–23:59)</option>
          </select>
        </label>
      </div>
      <button class="btn primary" type="submit">Search Flights</button>
    </form>

    <section id="results" class="results" aria-live="polite"></section>

    <section class="more-photos">
      <h2>Promotions!</h2>
      <div class="photo-row">
        <img src="Designer (1).jpg" alt="">
        <img src="pm.jpg" alt="">
        <img src="Designer (2).jpg" alt="">
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> SkyWings Airline</p>
  </footer>
</body>
</html>
