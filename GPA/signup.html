<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkyWings · Sign Up</title>
  <link rel="stylesheet" href="signup.css">
  <script src="app.js" defer></script>
</head>
<body data-page="signup">
  <header class="site-header">
    <a class="brand" href="index.html">✈ SkyWings</a>
    <nav class="nav">
  <a href="index.html">Home</a>
  <a href="destinations.html">Destinations</a>
  <a href="tickets.html">Tickets</a>
  <a href="food.html">Food</a>
  <a href="seats.html">Seats</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>

  <!-- Add these two: -->
  <a href="login.html" id="navLogin">Login</a>
  <a href="#" id="navLogout" hidden>Logout</a>
</nav>
  </header>

  <main class="wrap">
    <form id="signupForm" class="form">
      <h1>Create an Account</h1>
      <label>Full Name
        <input name="name" placeholder="Your name" required/>
      </label>
      <label>Email
        <input type="email" name="email" placeholder="you@example.com" required/>
      </label>
      <label>Password
        <input type="password" name="password" minlength="6" placeholder="Minimum 6 characters" required/>
      </label>
      <label>Confirm Password
        <input type="password" name="confirm" minlength="6" placeholder="Re-enter password" required/>
      </label>
      <button class="btn primary" type="submit">Create Account</button>
      <p class="hint">Already have an account? <a href="login.html">Login</a></p>
      <p id="signupStatus" class="status" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> SkyWings Airline</p>
  </footer>
</body>
</html>
