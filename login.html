<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkyWings · Login</title>
  <link rel="stylesheet" href="login.css">
  <script src="app.js" defer></script>
</head>
<body data-page="login">
  <header class="site-header">
    <a class="brand" href="index.html">✈ SkyWings</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="destinations.html">Destinations</a>
      <a href="tickets.html">Tickets</a>
      <a href="food.html">Food</a>
      <a href="seats.html">Seats</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>

      <!-- Auth controls (app.js toggles visibility) -->
      <a href="login.html" id="navLogin">Login</a>
      <a href="#" id="navLogout" hidden>Logout</a>
    </nav>
  </header>

  <main class="wrap">
    <form id="loginForm" class="form" novalidate>
      <h1>Welcome Back</h1>

      <!-- Optional hint for testers; remove if not needed -->
      <p id="credHint" class="muted" style="margin:0 0 10px;">
        Test credentials — Email: <code>demo@skywings.test</code>, Password: <code>demo123</code>
      </p>

      <label>Email
        <!-- IDs added + defaults prefilled to match app.js DEFAULT_AUTH -->
        <input
          id="loginEmail"
          type="email"
          name="email"
          placeholder="demo@skywings.test"
          required
          value="demo@skywings.test"
          autocomplete="email" />
      </label>

      <label>Password
        <input
          id="loginPassword"
          type="password"
          name="password"
          placeholder="demo123"
          required
          value="demo123"
          autocomplete="current-password" />
      </label>

      <button class="btn primary" type="submit">Login</button>

      <div class="row">
        <a href="reset.html">Forgot Password?</a>
        <span>·</span>
        <a href="signup.html">Create an account</a>
      </div>

      <p id="loginStatus" class="status" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> SkyWings Airline</p>
  </footer>
</body>
</html>
